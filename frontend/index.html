<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closed-Circuit — KSEB-TVM-F12</title>
    <meta name="theme-color" content="#121211" />
    <meta name="description" content="Simulated feeder, live consensus engine: LV conductor-break operator view." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body class="bg-bg">
    <script>
      // Stamp the theme before first paint so a light-theme viewer never sees
      // a black flash. Mirrors src/theme/theme.tsx; kept inline on purpose.
      (function () {
        try {
          var p = localStorage.getItem('cc-theme') || 'system';
          var r = p === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : p;
          document.documentElement.dataset.theme = r;
          document.documentElement.style.colorScheme = r;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
